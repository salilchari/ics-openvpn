name: Fire TV development APK
on:
  workflow_dispatch:
  push:
    branches: [firetv-development]
  pull_request:
    paths:
      - 'main/**'
      - '.github/workflows/firetv-development.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - name: Install native build tool
        run: sudo apt-get update && sudo apt-get install -y swig
      - name: Test and build development APK
        run: ./gradlew :main:testUiOvpn2DebugUnitTest :main:assembleUiOvpn2Debug
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-development-apk
          path: main/build/outputs/apk/uiOvpn2/debug/*.apk
          if-no-files-found: error
